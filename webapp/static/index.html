<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f3" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#11150f" media="(prefers-color-scheme:dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shelf Plan">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="/static/icons/icon-192.png">
<title>Shelf Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --ground:#f6f7f3; --panel:#fff; --sunk:#eef0ea; --field:#fff;
  --ink:#161c17; --ink-2:#4d564e; --ink-3:#7b857c;
  --rule:#d6dad1; --hair:#e7eae2;
  --accent:#2f6b4f; --accent-soft:#e3ede6; --accent-ink:#fff;
  --warn:#8a6410; --warn-soft:#f6eed9;
  --stop:#9c3a2c; --stop-soft:#f7e4e0;
  --shadow:0 1px 2px rgba(22,28,23,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#11150f; --panel:#181d17; --sunk:#1f251e; --field:#10140f;
    --ink:#e8ece4; --ink-2:#a7b1a5; --ink-3:#7d877c;
    --rule:#2c332a; --hair:#242a23;
    --accent:#7cc49b; --accent-soft:#1d2b23; --accent-ink:#0d130f;
    --warn:#d8ac52; --warn-soft:#2b2416;
    --stop:#e08573; --stop-soft:#2e1c18;
    --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5}
h1,h2,h3{font-family:Archivo,Helvetica,Arial,sans-serif;margin:0;text-wrap:balance}
.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 80px}
a{color:var(--accent)}

/* header */
header.top{border-bottom:1px solid var(--rule);background:var(--panel);position:sticky;top:0;z-index:20}
.top-in{max-width:1040px;margin:0 auto;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-family:Archivo;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.spacer{flex:1}
.who{color:var(--ink-3);font-size:13px}

/* controls */
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--rule);
  background:var(--panel);color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:6px 10px}
input,select,textarea{font:inherit;background:var(--field);color:var(--ink);
  border:1px solid var(--rule);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 5px}

/* nav */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:22px 0 20px;overflow-x:auto}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;
  padding:9px 14px;color:var(--ink-3);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* panels */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h2{font-size:17px;margin:0 0 3px}
.card .sub{color:var(--ink-3);font-size:13.5px;margin:0 0 14px}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}}

/* table */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-3);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--rule)}
td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}

/* bits */
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;
  background:var(--sunk);color:var(--ink-2)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.stop{background:var(--stop-soft);color:var(--stop)}
.up{color:var(--stop);font-weight:600}
.down{color:var(--accent);font-weight:600}
.muted{color:var(--ink-3)}
.note{background:var(--sunk);border-radius:8px;padding:11px 13px;font-size:14px;color:var(--ink-2)}
.err{background:var(--stop-soft);color:var(--stop);border-radius:8px;padding:11px 13px;font-size:14px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{background:var(--sunk);border-radius:10px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:0 0 16px}
.hide{display:none!important}
.center{max-width:400px;margin:60px auto}
.day{border:1px solid var(--rule);border-radius:10px;padding:14px;background:var(--panel)}
.day h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:0 0 9px}
.meal{padding:6px 0;border-bottom:1px solid var(--hair);font-size:14.5px}
.meal:last-child{border-bottom:0}
.aisle{font-family:Archivo;font-weight:600;font-size:13px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--accent);padding:16px 10px 6px}

/* phones: safe areas, bigger touch targets, no accidental zoom on focus */
.top-in,.wrap{padding-left:max(18px,env(safe-area-inset-left));
  padding-right:max(18px,env(safe-area-inset-right))}
body{padding-bottom:env(safe-area-inset-bottom)}
@media (max-width:560px){
  .wrap{padding-bottom:40px}
  button,.btn{padding:11px 16px;min-height:44px}
  nav.tabs button{padding:11px 13px;min-height:44px}
  /* iOS zooms the page when focusing a field under 16px */
  input,select,textarea{font-size:16px}
  .card{padding:14px;border-radius:10px}
  table{font-size:13.5px}
  td,th{padding:8px 7px}
  .stat .v{font-size:18px}
  .brand{font-size:17px}
}
@media (display-mode:standalone){
  header.top{padding-top:env(safe-area-inset-top)}
}
#installBtn{display:none}

/* recipe cards */
.recipe h4{font-family:Archivo;font-size:12px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--ink-3);margin:14px 0 6px}
.macros{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--ink-2);
  background:var(--sunk);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.macros b{color:var(--ink)}
ol.steps,ul.steps{margin:0;padding-left:20px;font-size:14px;color:var(--ink-2)}
ol.steps li,ul.steps li{margin:0 0 5px}
.small{font-size:12.5px}
button.tiny{padding:3px 9px;font-size:12.5px;min-height:0}
.was{font-size:12px;color:var(--ink-3);text-decoration:line-through}
/* a price that has moved ------------------------------------------------- */
.tag.deal{background:var(--stop);color:#fff;border-color:transparent;
  letter-spacing:.06em;font-weight:700}
.deal-price{color:var(--stop);font-weight:700}
.off{font-size:11.5px;font-weight:700;color:var(--stop);letter-spacing:.03em}
tr:has(.tag.deal){background:var(--stop-soft)}

/* one day at a time ------------------------------------------------------ */
.day-nav{margin:14px 0 4px;align-items:center}
.day-nav .day-name{font-family:Archivo,Helvetica,Arial,sans-serif;font-size:16px;
  min-width:96px;text-align:center}
.calendar.single{grid-template-columns:1fr}
.calendar.single .day{max-width:640px;margin:0 auto;width:100%}

/* choosing a different product for a line */
.pick-meta b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14.5px}
button.pick{width:100%;text-align:left;display:flex;gap:11px;align-items:center;
  padding:9px 11px;border-radius:10px}
button.pick:hover{border-color:var(--accent);background:var(--sunk)}
/* .pick-body is a column, so a tag inside it stretches the full width unless
   it is told not to. */
.pick-body .tag{align-self:flex-start;width:fit-content}
.pick-body b{font-weight:600;line-height:1.35}

.pick-meta .up{color:var(--warn)}
.pick-meta .down{color:var(--accent)}
.pick-meta{display:flex;gap:7px;flex:none;white-space:nowrap}

.goal-panel{margin:16px 0 0;padding:14px 15px;background:var(--sunk);
  border-radius:11px}

.spend{margin:12px 0 0;padding:11px 13px;background:var(--sunk);border-radius:10px}
.spend-row{display:flex;justify-content:space-between;gap:14px;padding:3px 0;
  font-size:14.5px}
.spend-row b{font-weight:600}

/* a day you can read ---------------------------------------------------- */
.day-line{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;
  color:var(--ink-2);padding:7px 0 9px;margin:0 0 4px;
  border-bottom:1px solid var(--hair)}
.day-line b{color:var(--ink);font-weight:600}
.day-line .hit b{color:var(--accent)}
.day-line .short b{color:var(--warn)}
.meal-macros{font-size:12.5px;color:var(--ink-3);margin:3px 0 0 26px}
.meal-macros b{color:var(--ink-2);font-weight:600}
.meal-ing{list-style:none;margin:6px 0 2px 26px;padding:0;font-size:13px}
.meal-ing li{display:flex;justify-content:space-between;gap:12px;
  padding:2px 0;border-bottom:1px dotted var(--hair);color:var(--ink-2)}
.meal-ing li:last-child{border-bottom:0}
.meal-ing li span:last-child{color:var(--ink-3);white-space:nowrap}
.meal.planned{padding:9px 0;border-bottom:1px solid var(--hair)}
.meal.planned:last-child{border-bottom:0}
.meal.planned.missing{opacity:.7}

.ing-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ing-line .as-written{font-style:italic;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;
  padding:6px 12px;min-height:34px;border-radius:999px;font-weight:600;
  background:var(--panel);color:var(--ink-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .muted{color:var(--accent-ink);opacity:.75}
tr .tag.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
tr .tag.stop{background:var(--stop-soft);color:var(--stop);border-color:transparent}

button.danger{color:var(--stop)}
button.danger:hover{border-color:var(--stop)}

/* rating */
.rating{display:flex;align-items:center;gap:1px}
button.star{background:none;border:0;padding:1px 2px;font-size:19px;line-height:1;
  color:var(--rule);cursor:pointer;min-height:0}
button.star:hover{color:var(--warn)}
button.star.on{color:var(--warn)}

/* shopping list ticks */
label.tick{display:flex;align-items:center;gap:8px;cursor:pointer}
label.tick input{width:18px;height:18px;accent-color:var(--accent);flex:none}
tr.got td{opacity:.5}
tr.got label.tick span{text-decoration:line-through}

/* sparkline */
.spark{display:block}
.spark-cell{width:230px}
.option{border-color:var(--rule)}
.option:hover{border-color:var(--accent)}
.opt-letter{display:flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:6px;background:var(--accent);
  color:var(--accent-ink);font-family:"IBM Plex Mono",monospace;
  font-weight:600;font-size:13px;flex:none}

/* calendar */
.calendar{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:680px){.calendar{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.calendar{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1320px){.calendar{grid-template-columns:repeat(4,1fr)}}
.calendar .day h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.calendar .day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
button.add-day{width:100%;margin-top:8px;border-style:dashed;color:var(--ink-3)}
button.add-day:hover{color:var(--accent);border-color:var(--accent)}

/* daily goals */
.goals-row{margin-top:12px;gap:14px;padding:10px 12px;background:var(--sunk);
  border-radius:9px}
.goals-row label{display:inline-flex;align-items:center;gap:5px;margin:0;
  font-weight:400}
.goals-row input{padding:4px 7px}
.day-goals{display:grid;gap:7px;margin:10px 0 4px;padding-top:9px;
  border-top:1px solid var(--hair)}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;color:var(--ink-3)}
.goal-top .num{font-size:12.5px;color:var(--ink-2)}
.goal-track{height:4px;border-radius:3px;background:var(--sunk);overflow:hidden}
.goal-track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.goal.miss .goal-track i{background:var(--warn)}
.goal-note{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.goal.miss .goal-note{color:var(--warn)}
.goal.ok .goal-note{color:var(--accent)}
.meal.planned{padding:7px 0}
.meal.planned label.tick{align-items:flex-start;gap:6px}
.meal-name{flex:1;min-width:0;line-height:1.35}
.meal-controls{display:flex;align-items:center;gap:8px;margin:4px 0 0 26px}
.meal-controls .num{flex:1}
.meal.off{opacity:.45}
.meal.off span{text-decoration:line-through}
input.mult{width:42px;padding:2px 5px;font-size:12.5px;text-align:center}

/* category dots */
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;
  background:var(--ink-3)}
.dot.cat-chicken{background:#c8922f}
.dot.cat-beef{background:#9c3a2c}
.dot.cat-pork{background:#c2748c}
.dot.cat-lamb{background:#7d5a3c}
.dot.cat-fish{background:#3f7fa6}
.dot.cat-vegetarian{background:#2f6b4f}
.dot.cat-other{background:var(--ink-3)}

/* cook counter */
.counter{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);
  border-radius:999px;padding:2px 4px;font-size:12.5px;color:var(--ink-2)}
.counter button{padding:0 7px;min-height:0;line-height:1.5}
.counter button:disabled{opacity:.35}

/* scanner */
.scan-sheet{width:min(480px,94vw)}
.scan-view{position:relative;border-radius:12px;overflow:hidden;background:#000;
  aspect-ratio:4/3}
.scan-view video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:22% 12%;border:2px solid rgba(255,255,255,.9);
  border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}

/* picker sheet */
.sheet-back{position:fixed;inset:0;background:rgba(19,23,20,.45);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(620px,94vw);max-height:86vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;margin:0 0 12px}
.sheet-body{overflow-y:auto;min-height:0}
h4.pick-head{font-family:Archivo;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-3);margin:14px 0 6px;font-weight:600}
h4.pick-head:first-child{margin-top:0}
.pick-list{display:grid;gap:6px}
button.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;background:var(--panel);border:1px solid var(--hair);
  font-weight:400}
button.pick:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick-body{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.pick-body b{font-weight:600}
.pick-meta{display:flex;gap:4px;flex:none}
@media(max-width:560px){.sheet{width:96vw;max-height:90vh;padding:14px}}

.thumb{width:46px;height:46px;border-radius:8px;object-fit:contain;flex:none;
  background:#fff;border:1px solid var(--hair)}
.thumb.none{display:flex;align-items:center;justify-content:center;
  background:var(--sunk);color:var(--ink-3);font-family:Archivo,sans-serif;
  font-weight:600;font-size:17px}
.prod-row{display:flex;gap:11px;align-items:flex-start}
.prod-row>div{min-width:0}
td.prod{min-width:250px}
@media (max-width:560px){.option{border-color:var(--rule)}}
/* A read is confirmed by the frame flashing, so a scan is visibly a scan even
   where the phone has vibration switched off. */
.scan-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.scan-flash.lit{animation:scanlit .28s ease-out}
@keyframes scanlit{from{opacity:.75}to{opacity:0}}
.scan-tools{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
.scan-toggle{display:inline-flex;align-items:center;gap:6px;margin:0;
  font-size:13px;color:var(--ink-2);cursor:pointer}
.scan-toggle input{margin:0}
.scan-list{margin-top:6px;display:grid;gap:6px;overflow-y:auto;max-height:34vh}
.scan-row{display:flex;align-items:center;gap:10px;padding:6px 8px;
  background:var(--sunk);border-radius:9px}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.scan-flash.lit{animation:none}}

/* ingredient photographs -------------------------------------------------
   A generated recipe has no photograph of its own. These are the real product
   shots from the catalogue, so a card shows what actually goes in the dish
   rather than a stock picture of something nobody cooked. */
.food-pic{object-fit:contain;background:var(--sunk);border-radius:7px;
  flex:none;display:block}
.food-pic.none{display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-family:Archivo;font-weight:600;line-height:1}
/* A glyph needs to be nearly the size of the tile to read as a picture; a
   letter wants to stay small and quiet. */
.food-pic.none.tiny{font-size:14px}
.food-pic.none.small{font-size:19px}
.food-pic.none.tile{font-size:30px}
.food-pic.none.big{font-size:34px}
.food-pic.tiny{width:22px;height:22px;border-radius:5px;font-size:10px}
.food-pic.small{width:30px;height:30px;font-size:12px}
.food-pic.tile{width:54px;height:54px;font-size:17px}
.food-pic.big{width:100%;height:74px;border-radius:0;font-size:20px}

.recipe-hero{display:block;width:100%;height:190px;object-fit:cover;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:var(--sunk)}

.recipe-strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  gap:1px;background:var(--rule);border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);margin:2px 0 0}
.strip-cell{margin:0;background:var(--panel);display:flex;
  flex-direction:column;min-width:0}
.strip-cell figcaption{font-size:10.5px;color:var(--ink-3);padding:4px 6px 5px;
  text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:.02em}

.ing-row{display:flex;align-items:center;gap:9px}
.ing-name{flex:1;min-width:0}

/* the recipe book ------------------------------------------------------- */
.book-grid{display:grid;gap:12px;margin-top:14px;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.book-tile{display:flex;flex-direction:column;border:1px solid var(--rule);
  border-radius:11px;overflow:hidden;background:var(--panel)}
.tile-pics{display:flex;gap:1px;background:var(--rule)}
.tile-pics .food-pic{flex:1;width:auto;height:60px;border-radius:0}
.tile-body{display:flex;flex-direction:column;flex:1;gap:6px;padding:10px 11px 11px}
.tile-body .macros{gap:9px;flex-wrap:wrap}

/* planning a whole week ------------------------------------------------- */
.auto-card{border-color:var(--accent)}
.auto-days{display:grid;gap:7px;margin-top:10px}
.auto-day{padding:8px 11px;border-radius:9px;background:var(--sunk);
  border-left:3px solid var(--accent)}
.auto-day.miss{border-left-color:var(--warn)}
.auto-day-top{display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;flex-wrap:wrap}
.warn-text{color:var(--warn)}

/* a one-line report ----------------------------------------------------- */
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);
  z-index:60;max-width:min(560px,92vw);padding:10px 16px;border-radius:10px;
  background:var(--ink);color:var(--panel);font-size:13.5px;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:transform .22s ease}
.toast.up{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* picker sheet */
.sheet-back{position:fixed;inset:0;background:rgba(19,23,20,.45);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(620px,94vw);max-height:86vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;margin:0 0 12px}
.sheet-body{overflow-y:auto;min-height:0}
h4.pick-head{font-family:Archivo;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-3);margin:14px 0 6px;font-weight:600}
h4.pick-head:first-child{margin-top:0}
.pick-list{display:grid;gap:6px}
button.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;background:var(--panel);border:1px solid var(--hair);
  font-weight:400}
button.pick:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick-body{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.pick-body b{font-weight:600}
.pick-meta{display:flex;gap:4px;flex:none}
@media(max-width:560px){.sheet{width:96vw;max-height:90vh;padding:14px}}

@media (max-width:560px){.thumb{width:38px;height:38px}}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel);color:var(--ink-3);
  padding:8px 14px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--rule)}
button.tiny.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dropzone{border:2px dashed var(--rule);border-radius:12px;padding:22px 16px;
  text-align:center;background:var(--sunk);transition:border-color .12s}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone p{margin:0 0 8px}
.dropzone input[type=file]{width:auto;background:none;border:0;padding:0}
details summary{cursor:pointer}
@media (max-width:560px){.spark-cell{display:none}}
/* ---------------------------------------------------------------- mobile */
/*
 * A table is the wrong shape for a phone. Below 700px the rows stop being
 * rows: each becomes a small stacked card, so nothing needs scrolling
 * sideways to read. The markup is unchanged -- only its display is.
 */
@media (max-width: 700px) {
  .wrap { padding-left: 12px; padding-right: 12px; }
  .card { padding: 14px 13px; }
  .scroll { overflow-x: visible; }

  table, thead, tbody, tr, th, td { display: block; width: auto; }

  /* Column headings mean nothing once the rows are stacked. */
  table thead { position: absolute; left: -9999px; }

  table tbody tr {
    background: var(--panel);
    border: 1px solid var(--hair);
    border-radius: 10px;
    padding: 11px 12px;
    margin: 0 0 9px;
  }
  table tbody tr:last-child { margin-bottom: 0; }
  table tbody td { border: 0; padding: 2px 0; text-align: left !important; }

  /* Each cell says what it is, taken from the heading it replaced. */
  table tbody td[data-label]:not(:first-child) {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  table tbody td[data-label]:not(:first-child)::before {
    content: attr(data-label);
    font-size: 11.5px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-3);
    flex: none;
  }
  /* An empty value would leave a heading dangling on its own. */
  table tbody td[data-label]:empty,
  table tbody td[data-label="—"] { display: none; }

  /* The aisle heading is a full-width divider, not a card. */
  table tbody tr.aisle-row {
    background: none;
    border: 0;
    padding: 14px 0 2px;
    margin: 0;
  }
  table tbody tr.aisle-row td { padding: 0; }

  /* Wider tap targets, and inputs that do not trigger iOS zoom. */
  button, .btn { min-height: 44px; padding: 10px 15px; }
  button.tiny { min-height: 36px; padding: 6px 12px; }
  input, select, textarea { font-size: 16px; }
  input.mult { min-height: 36px; width: 52px; }

  .row { gap: 8px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat .v { font-size: 18px; }

  /* The week is one day per row on a phone; four columns is unreadable. */
  .calendar { grid-template-columns: 1fr; }

  /* Sheets become bottom sheets, which is the phone convention. */
  .sheet {
    inset: auto 0 0 0;
    transform: none;
    width: 100%;
    max-height: 88vh;
    border-radius: 16px 16px 0 0;
    padding: 16px 14px calc(16px + env(safe-area-inset-bottom));
  }

  /* Tabs scroll but should not look cut off mid-word. */
  nav.tabs { margin: 14px 0 16px; }
  nav.tabs button { padding: 11px 12px; font-size: 14.5px; }

  .goals-row { flex-direction: column; align-items: flex-start; gap: 8px; }
  .goals-row label { width: 100%; justify-content: space-between; }
}

/* ------------------------------------------------------------- recipes -- */
/*
 * Recipes ran together with nothing marking where one ended and the next
 * began. They are now clearly bounded cards with a titled header.
 */
.recipe {
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 0;
  overflow: hidden;
  background: var(--panel);
  box-shadow: var(--shadow);
}
.recipe > .recipe-head {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 13px 15px;
  background: var(--sunk);
  border-bottom: 1px solid var(--rule);
}
.recipe > .recipe-head h3 { font-size: 16px; line-height: 1.3; }
.recipe > .recipe-body { padding: 13px 15px 15px; }
.recipe .macros { margin-bottom: 12px; }
.recipe h4 {
  font-family: Archivo, sans-serif;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--ink-3);
  margin: 16px 0 7px;
  padding-top: 12px;
  border-top: 1px solid var(--hair);
}
.recipe h4:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.recipe .meal { padding: 5px 0; }
.recipe-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 11px 15px;
  background: var(--sunk);
  border-top: 1px solid var(--rule);
}
/* Room above, or the tags butt straight into the header's rule and read as
   though they have been sliced off. */
.recipe-tags { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 15px; }
.recipe-tags:empty { display: none; }

/* A folded section keeps the heading looking like a heading and puts the
   marker where a reader expects it. */
.fold > summary { list-style: none; cursor: pointer; display: flex;
  align-items: baseline; gap: 8px; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: "▾"; margin-left: auto; color: var(--ink-3);
  font-size: 12px; }
.fold[open] > summary::after { content: "▴"; }
.fold > summary h4 { margin-bottom: 0; }
.fold > summary:hover h4 { color: var(--ink-2); }
.recipe-tags .tag { flex: none; max-width: 100%; }

/* A grid stretches every cell to the tallest in its row, so a short recipe
   next to a long one gained several hundred pixels of nothing. Cards keep
   their own height; the column ends where the card ends. */
.grid.g2 { align-items: start; }
.recipe { display: flex; flex-direction: column; }
.recipe > .recipe-body { flex: 1 1 auto; }
/* =========================================================================
   A second pass on the look, and on the size of everything.

   Two complaints drove this: the type was too small to read comfortably on a
   phone, and the whole thing was flat. The palette keeps its herb green -- it
   is a food app -- but sits it on warm paper rather than cold grey, which
   gives the white cards something to lift off. Everything steps up a size.
   ========================================================================= */

:root{
  --ground:#f2f0e9; --panel:#fffdf8; --sunk:#e9e5da; --field:#fffdf8;
  --ink:#151810; --ink-2:#4a5143; --ink-3:#78806d;
  --rule:#dbd5c7; --hair:#ebe6da;
  --accent:#2d6a46; --accent-soft:#e0eae0; --accent-ink:#fffdf8;
  --warn:#8a5f10; --warn-soft:#f6ecd6;
  --stop:#9a3728; --stop-soft:#f7e2dd;
  --shadow:0 1px 2px rgba(21,24,16,.05), 0 6px 16px -10px rgba(21,24,16,.18);
  --lift:0 2px 4px rgba(21,24,16,.06), 0 14px 30px -18px rgba(21,24,16,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101208; --panel:#191c13; --sunk:#22261a; --field:#0e1009;
    --ink:#edeadc; --ink-2:#aab0a0; --ink-3:#7e8574;
    --rule:#2f3427; --hair:#262a1f;
    --accent:#86c79b; --accent-soft:#1d2a20; --accent-ink:#0c110b;
    --warn:#dcb055; --warn-soft:#2b2513;
    --stop:#e28a76; --stop-soft:#2f1d17;
    --shadow:0 1px 2px rgba(0,0,0,.5);
    --lift:0 18px 40px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#101208; --panel:#191c13; --sunk:#22261a; --field:#0e1009;
  --ink:#edeadc; --ink-2:#aab0a0; --ink-3:#7e8574;
  --rule:#2f3427; --hair:#262a1f;
  --accent:#86c79b; --accent-soft:#1d2a20; --accent-ink:#0c110b;
  --warn:#dcb055; --warn-soft:#2b2513;
  --stop:#e28a76; --stop-soft:#2f1d17;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --lift:0 18px 40px -22px rgba(0,0,0,.8);
}

/* --- size ---------------------------------------------------------------
   Every step up from here is deliberate. 13px secondary text is legible on a
   monitor at arm's length and squinting on a phone, and most of this app's
   text was secondary text. */
body{font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px}
.small{font-size:13.5px}
.muted.small,.sub{font-size:14.5px}
label{font-size:13.5px;margin:0 0 6px}
table{font-size:15.5px}
.tag{font-size:12px;padding:5px 11px;line-height:1.25}
.stat .k{font-size:12.5px}
.stat .v{font-size:23px}
.who{font-size:14px}
.brand{font-size:20px}

.card{border-radius:14px;padding:20px;box-shadow:var(--shadow);margin:0 0 18px}
.card h2{font-size:19.5px;letter-spacing:-.01em}
.card .sub{margin:0 0 16px}

h1{letter-spacing:-.02em}
h3{font-size:17.5px}
h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  margin:16px 0 7px;font-family:Archivo,Helvetica,Arial,sans-serif}

button,.btn{border-radius:9px;padding:9px 15px;min-height:40px}
button.ghost{padding:7px 11px;min-height:34px}
button.tiny{min-height:30px;padding:4px 10px;font-size:13px}
input,select,textarea{border-radius:9px;padding:10px 12px}

/* --- the tabs -----------------------------------------------------------
   Nine underlined labels in a scrolling strip gave no sense of where you were
   on a phone. Pills read as separate things and take a thumb better. */
nav.tabs{gap:6px;border-bottom:0;margin:18px 0 18px;padding:4px;
  background:var(--sunk);border-radius:12px;
  scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border-radius:9px;border-bottom:0;padding:9px 15px;font-size:15px;
  font-weight:600;color:var(--ink-3);white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);
  box-shadow:var(--shadow)}

header.top{box-shadow:var(--shadow)}

/* --- the shopping list --------------------------------------------------
   This is read one-handed in an aisle, so the thing you are looking for is
   the biggest thing on the row. */
.shop-name{font-size:17.5px;font-weight:600;line-height:1.3}
tr.got .shop-name{color:var(--ink-3);text-decoration:line-through}
.prod-row label.tick{align-items:flex-start;gap:9px}
.prod-row input[type=checkbox]{width:21px;height:21px;flex:none;margin-top:2px;
  accent-color:var(--accent)}
.aisle{font-size:12.5px;letter-spacing:.07em}

/* Meal-of-the-day markers. Colour separates them at a glance without needing
   to read the word. */
/* Named `when`, not `meal`: `.meal` is already a shopping-list row, and a tag
   wearing both quietly inherited that row's padding and border. */
.tag.when{border-color:transparent}
.tag.when-breakfast{background:var(--warn-soft);color:var(--warn)}
.tag.when-lunch{background:var(--accent-soft);color:var(--accent)}
.tag.when-dinner{background:var(--sunk);color:var(--ink-2)}
.sitting{display:inline-block;font-size:11.5px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  margin-right:7px;vertical-align:1px}
.tile-tags{display:flex;gap:5px;flex-wrap:wrap}

/* saved shopping lists */
.saved-list{display:grid;gap:8px}
.saved-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--sunk);border-radius:10px}

button.danger{color:var(--stop)}
button.danger:hover{border-color:var(--stop);background:var(--stop-soft)}

.book-tile{box-shadow:var(--shadow);transition:box-shadow .16s ease}
.book-tile:hover{box-shadow:var(--lift)}
@media (prefers-reduced-motion:reduce){.book-tile{transition:none}}

@media (max-width:560px){
  body{font-size:17px}
  .card{padding:16px 15px;border-radius:12px}
  .card h2{font-size:18.5px}
  table{font-size:15px}
  .small{font-size:13.5px}
  .shop-name{font-size:17px}
  nav.tabs button{padding:10px 14px;min-height:44px}
  .stat .v{font-size:20px}
}

</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">Shelf<span>Plan</span></div>
    <div class="spacer"></div>
    <div id="planPicker" class="row hide">
      <select id="planSelect" style="width:auto;min-width:180px"></select>
      <button id="newPlan" class="ghost">New</button>
      <button id="renamePlan" class="ghost" title="Rename this plan">Rename</button>
      <button id="deletePlan" class="ghost danger"
        title="Delete this plan and everything in it">Delete</button>
    </div>
    <div id="userBox" class="row hide">
      <span class="who" id="whoami"></span>
      <button id="installBtn" class="ghost">Install</button>
      <button id="signOut" class="ghost">Sign out</button>
    </div>
  </div>
</header>

<!-- Sign in -->
<section id="authView" class="wrap hide">
  <div class="card center">
    <h2 id="authTitle">Sign in</h2>
    <p class="sub" id="authSub">Your plan and price history sync to your account.</p>
    <div id="authErr" class="err hide"></div>
    <div class="grid">
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
      <div><label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password"></div>
      <div id="inviteRow" class="hide"><label for="invite">Invite code</label>
        <input id="invite" autocomplete="off"
               placeholder="Ask whoever shared this link"></div>
      <button id="authGo" class="primary">Sign in</button>
      <p class="muted" style="font-size:14px;margin:0">
        <span id="authSwitchText">No account yet?</span>
        <a href="#" id="authSwitch">Create one</a>
        <span id="forgotWrap"> &middot; <a href="#" id="forgotLink">Forgot password?</a></span>
      </p>
    </div>
  </div>
</section>

<!-- Choose a new password (reached from a reset link) -->
<section id="resetView" class="wrap hide">
  <div class="card center">
    <h2>Choose a new password</h2>
    <p class="sub">The link works once. Setting a password signs out every other
      device.</p>
    <div id="resetErr" class="err hide"></div>
    <div class="grid">
      <div><label for="newPassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password"></div>
      <div><label for="newPassword2">Repeat it</label>
        <input id="newPassword2" type="password" autocomplete="new-password"></div>
      <button id="resetGo" class="primary">Set password and sign in</button>
      <p class="muted" style="font-size:14px;margin:0">
        <a href="/" id="resetCancel">Back to sign in</a></p>
    </div>
  </div>
</section>

<!-- App -->
<main id="appView" class="wrap hide">
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="week" aria-selected="true">Week</button>
    <button role="tab" data-tab="build" aria-selected="false">Recipe builder</button>
    <button role="tab" data-tab="shop" aria-selected="false">Shopping list</button>
    <button role="tab" data-tab="prices" aria-selected="false">Prices</button>
    <button role="tab" data-tab="search" aria-selected="false">Find food</button>
    <button role="tab" data-tab="findrec" aria-selected="false">Find a recipe</button>
    <button role="tab" data-tab="own" aria-selected="false">Write one</button>
    <button role="tab" data-tab="recipes" aria-selected="false">Recipes</button>
    <button role="tab" data-tab="data" aria-selected="false">Data</button>
  </nav>
  <div id="panels"></div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
